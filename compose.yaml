services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wordstead
      POSTGRES_USER: wordstead
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Copy .env.example to .env and set DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - wordstead-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordstead -d wordstead"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wordstead-postgres:
