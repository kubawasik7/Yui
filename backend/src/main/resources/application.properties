spring.application.name=yui-api
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/wordstead}
spring.datasource.username=${DATABASE_USER:wordstead}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
yui.ai.gemini.api-key=${GEMINI_API_KEY:}
yui.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
yui.tts.elevenlabs.api-key=${ELEVENLABS_API_KEY:}
yui.tts.elevenlabs.voice-id=${ELEVENLABS_VOICE_ID:}
yui.tts.elevenlabs.model-id=${ELEVENLABS_MODEL_ID:eleven_flash_v2_5}
yui.tts.elevenlabs.cache-directory=${YUI_TTS_CACHE_DIR:${user.home}/.yui/audio-cache}
